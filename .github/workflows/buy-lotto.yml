name: Buy Lotto

on:
  schedule:
    # UTC 03:00 = 12:00 KST. Friday pension, Sunday lotto.
    - cron: "0 3 * * 5"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: 구매 예정 정보만 확인 (실제 구매 없음)"
        type: boolean
        default: false
      target:
        description: "이번 실행 대상 (구매 구성은 config/report.json 사용)"
        type: choice
        required: true
        default: LOTTO_ONLY
        options:
          - LOTTO_ONLY
          - PENSION_ONLY
          - BOTH

permissions:
  contents: read

# Serialize manual and scheduled purchases across branches.
concurrency:
  group: lottery-purchases
  cancel-in-progress: false

jobs:
  buy-lotto:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Buy lotto
        run: pnpm run buy
        env:
          LOTTO_USER_ID: ${{ secrets.LOTTO_USER_ID }}
          LOTTO_USER_PASSWORD: ${{ secrets.LOTTO_USER_PASSWORD }}
          LOTTO_BUY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.schedule == '0 3 * * 5' && 'PENSION_ONLY' || 'LOTTO_ONLY') }}
          PURCHASE_CONFIG_PATH: config/report.json
          PLAYWRIGHT_HEADLESS: "true"
          LOTTO_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
